<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tracker">
<meta name="theme-color" content="#0f1115">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="log.css">
<title>Tracker</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --card2:#22262f; --text:#e9edf3; --muted:#8b93a3; --line:#2a2f39; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { background:var(--bg); }
  body { margin:0; background:var(--bg); color:var(--text); font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
         padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 32px); -webkit-user-select:none; user-select:none; max-width:560px; margin:0 auto; }
  header { display:flex; align-items:baseline; justify-content:space-between; margin:4px 2px 18px; }
  h1 { font-size:26px; margin:0; font-weight:700; letter-spacing:-.3px; }
  .date { color:var(--muted); font-size:14px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .grid.g3 { grid-template-columns:repeat(3, 1fr); gap:10px; }
  .g3 .tile { min-height:108px; padding:12px 11px; border-radius:18px; }
  .g3 .tile .ic { font-size:24px; }
  .g3 .tile .lb { font-size:14px; line-height:1.2; }
  .g3 .tile .st { font-size:12px; }
  .g3 .tile.on .st, .g3 .tile.wait .st { font-size:16px; }
  .g3 .tile.on::after { top:11px; right:11px; width:8px; height:8px; }
  .sec { display:flex; justify-content:space-between; align-items:baseline; margin:22px 2px 10px; }
  .sec:first-child { margin-top:0; }
  .sec h2 { margin:0; color:var(--c); }
  .sec .tot { color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; }
  .tile { position:relative; border:0; border-radius:20px; background:var(--card); color:var(--text); padding:16px; min-height:112px; text-align:left;
          display:flex; flex-direction:column; justify-content:space-between; font:inherit; cursor:pointer; transition:transform .08s, background .2s; overflow:hidden; }
  .tile:active { transform:scale(.97); }
  .tile .ic { font-size:30px; line-height:1; }
  .tile .lb { font-weight:650; font-size:17px; }
  .tile .st { color:var(--muted); font-size:13px; margin-top:2px; font-variant-numeric:tabular-nums; }
  .tile.on { background:var(--c); color:#0b0d10; }
  .tile.on .st { color:#0b0d10; font-weight:700; font-size:20px; }
  .tile.on::after { content:""; position:absolute; top:14px; right:14px; width:10px; height:10px; border-radius:50%; background:#0b0d10; animation:pulse 1.2s infinite; }
  .tile.wait { background:var(--card2); box-shadow:inset 0 0 0 2px var(--c); }
  .tile.wait .st { color:var(--text); font-weight:700; font-size:18px; }
  .tile.busy { opacity:.6; }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.25 } }
  h2 { font-size:15px; color:var(--muted); font-weight:600; margin:26px 2px 10px; text-transform:uppercase; letter-spacing:.6px; }
  .list { background:var(--card); border-radius:18px; overflow:hidden; }
  .row { display:flex; align-items:center; gap:12px; padding:13px 14px; border-top:1px solid var(--line); }
  .row:first-child { border-top:0; }
  .row .ic { font-size:20px; width:26px; text-align:center; }
  .row .tx { flex:1; min-width:0; }
  .row .t1 { font-weight:600; }
  .row .t2 { color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; }
  .row .du { font-variant-numeric:tabular-nums; font-weight:600; }
  .row button { margin-left:6px; border:0; background:var(--card2); color:var(--muted); width:32px; height:32px; border-radius:10px; font-size:16px; }
  .empty { color:var(--muted); padding:16px; text-align:center; font-size:14px; }
  .buddy { display:flex; align-items:center; gap:12px; background:var(--card); border-radius:16px; padding:11px 14px; margin:0 0 14px; }
  .buddy .av { width:32px; height:32px; border-radius:50%; background:var(--card2); display:grid; place-items:center; font-weight:700; flex:none; position:relative; }
  .buddy .av.live::after { content:''; position:absolute; right:-1px; bottom:-1px; width:10px; height:10px; border-radius:50%; background:#34c76b; border:2px solid var(--card); }
  .buddy .tx { flex:1; min-width:0; font-size:14px; line-height:1.35; }
  .buddy .tx b { font-weight:650; }
  .buddy .sub { color:var(--muted); font-size:13px; }
  .buddy .tm { font-variant-numeric:tabular-nums; font-weight:650; }
  .warn { background:#3a2a12; color:#ffcf8a; border-radius:14px; padding:12px 14px; font-size:14px; margin-bottom:14px; display:none; }
  #toast { position:fixed; left:16px; right:16px; bottom:calc(env(safe-area-inset-bottom) + 20px); background:#ff5d73; color:#fff; padding:14px 16px; border-radius:14px; font-weight:600;
           transform:translateY(calc(100% + 60px)); visibility:hidden; transition:transform .25s, visibility .25s; z-index:20; }
  #toast.show { transform:none; visibility:visible; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:flex-end; z-index:10; }
  .modal.show { display:flex; }
  .sheet { background:var(--card); width:100%; border-radius:22px 22px 0 0; padding:22px 18px calc(env(safe-area-inset-bottom) + 24px); }
  @media (min-width:700px) { .modal { align-items:center; justify-content:center; } .sheet { width:380px; max-width:92vw; border-radius:22px; padding-bottom:24px; } }
  .sheet h3 { margin:0 0 6px; font-size:20px; }
  .sheet p { margin:0 0 16px; color:var(--muted); }
  .sheet input, .sheet select { width:100%; font:inherit; font-size:22px; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--text); margin-bottom:14px; }
  .sheet select { font-size:24px; font-weight:600; padding:14px 12px; border-radius:14px; -webkit-appearance:none; appearance:none; text-align:center; text-align-last:center; }
  .endsheet { background:var(--bg); border:1px solid var(--line); padding-top:18px; }
  @media (min-width:700px) { .endsheet { width:440px; } }
  .endsheet .et { font-size:15px; font-weight:650; margin:0 2px 14px; color:var(--text); }
  .endsheet .et span { color:var(--muted); font-weight:500; }
  .endsheet .elab { display:flex; align-items:center; justify-content:space-between; margin:0 2px 10px; }
  .endsheet .el { font-size:15px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; }
  .endsheet .edr { display:flex; align-items:center; gap:6px; }
  .endsheet .eseg { display:flex; background:var(--card); border-radius:10px; padding:2px; gap:2px; }
  .endsheet .eseg button { border:0; background:transparent; color:var(--muted); font:inherit; font-size:12px; font-weight:600; padding:4px 8px; border-radius:8px; cursor:pointer; white-space:nowrap; }
  .endsheet .eseg button[aria-pressed=true] { background:var(--card2); color:var(--text); }
  .endsheet .eseg button:disabled { opacity:.35; cursor:default; }
  .endsheet .ecal { position:relative; width:32px; height:28px; border-radius:9px; background:var(--card); color:var(--muted); display:flex; align-items:center; justify-content:center; }
  .endsheet .ecal input { position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; border:0; padding:0; margin:0; }
  .endsheet .epair { display:flex; align-items:stretch; background:var(--card); border-radius:18px; padding:10px 10px 12px; font-variant-numeric:tabular-nums; }
  .endsheet .ehalf { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; }
  .endsheet .eread, .endsheet input.eread { width:100%; height:92px; padding:0 6px; margin:0; border:0; border-radius:12px; background:none; color:#ff8a3d; font:inherit; font-size:36px; font-weight:700; letter-spacing:-1px; text-align:center; cursor:pointer; }
  .endsheet button.eread:hover, .endsheet input.eread:hover, .endsheet input.eread:focus { background:var(--card2); outline:0; }
  .endsheet input.eread::-webkit-calendar-picker-indicator { display:none; }
  .endsheet .eu { color:var(--muted); font-size:13px; margin-top:4px; min-height:20px; }
  .endsheet .elink { width:36px; display:flex; align-items:center; justify-content:center; }
  .endsheet .elink span { width:34px; height:34px; border-radius:50%; background:var(--card2); color:#ff8a3d; display:flex; align-items:center; justify-content:center; }
  .endsheet .eu { background:none; border:0; font-family:inherit; padding:2px 6px; border-radius:8px; }
  .endsheet button.eu { cursor:pointer; } .endsheet button.eu:hover { background:var(--card2); }
  .endsheet .ewheels { display:flex; align-items:center; justify-content:center; gap:2px; width:100%; }
  .endsheet .ewheel { position:relative; flex:1; min-width:0; }
  .endsheet .eband { position:absolute; left:0; right:0; top:44px; height:44px; border-radius:12px; background:var(--card2); z-index:0; pointer-events:none; }
  .endsheet .edrum { position:relative; z-index:1; height:132px; overflow-y:auto; scroll-snap-type:y mandatory; padding-block:44px; scrollbar-width:none; outline:0; border-radius:12px; overscroll-behavior:contain; touch-action:pan-y; cursor:grab; -webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent); mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent); }
  .endsheet .edrum::-webkit-scrollbar { display:none; }
  .endsheet .edrum:focus-visible { box-shadow:0 0 0 2px #4f8cff; }
  .endsheet .eit { height:44px; scroll-snap-align:center; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:600; color:var(--muted); opacity:.55; user-select:none; -webkit-user-select:none; }
  .endsheet .eit.on { font-size:36px; font-weight:700; color:var(--text); opacity:1; letter-spacing:-1px; }
  .endsheet .ehalf.r .eit.on { color:#ff8a3d; }
  .endsheet .ecolon { font-size:30px; font-weight:700; color:var(--muted); padding-bottom:4px; }
  .endsheet .eagol { color:var(--muted); font-size:12px; text-align:center; margin-top:4px; }
  .endsheet .eub { display:flex; gap:4px; justify-content:center; flex-wrap:wrap; }
  .endsheet button.eu.add { color:var(--text); background:var(--card2); }
  .endsheet button.eu.done, .endsheet button.eu.done:hover { background:#2fb86a; color:#04170c; font-weight:700; font-size:14px; padding:6px 18px; border-radius:10px; margin-top:6px; }
  .endsheet .drums, .endsheet .agos { display:flex; align-items:center; justify-content:center; gap:2px; width:100%; }
  .endsheet .colon { font-size:30px; font-weight:700; color:var(--muted); padding-bottom:4px; }
  .endsheet .wheel { position:relative; flex:1; min-width:0; }
  .endsheet .drum { position:relative; height:132px; overflow-y:auto; scroll-snap-type:y mandatory; padding-block:44px; scrollbar-width:none; flex:1; min-width:0; outline:0; border-radius:12px; overscroll-behavior:contain; touch-action:pan-y; cursor:grab; -webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent); mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent); z-index:1; }
  .endsheet .drum::-webkit-scrollbar { display:none; }
  .endsheet .it { height:44px; scroll-snap-align:center; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:600; color:var(--muted); opacity:.55; user-select:none; -webkit-user-select:none; }
  .endsheet .it.on { font-size:36px; font-weight:700; color:#ff8a3d; opacity:1; letter-spacing:-1px; }
  .endsheet .band { position:absolute; left:0; right:0; top:44px; height:44px; border-radius:12px; background:var(--card2); pointer-events:none; }
  .endsheet .agol { color:var(--muted); font-size:12px; text-align:center; margin-top:4px; }
  .endsheet .ub { display:flex; gap:4px; justify-content:center; flex-wrap:wrap; }
  .endsheet button.unit { color:var(--text); background:var(--card2); border:0; font:inherit; font-size:13px; margin-top:4px; padding:4px 10px; border-radius:8px; cursor:pointer; }
  .endsheet button.unit.done { background:#2fb86a; color:#04170c; font-weight:700; font-size:14px; padding:6px 18px; border-radius:10px; margin-top:6px; }
  .endsheet .eread { cursor:pointer; }
  .endsheet .esum { text-align:center; color:var(--muted); font-size:13px; margin:12px 0 14px; min-height:18px; }
  .endsheet .esum.bad { color:#ff5d73; font-weight:600; }
  .endsheet .btn:disabled { opacity:.4; }
  .btns { display:grid; gap:10px; }
  .btn { border:0; border-radius:14px; padding:15px; font:inherit; font-weight:650; background:var(--card2); color:var(--text); }
  .btn.pri { background:#4f8cff; color:#fff; }
  .btn.dan { background:transparent; color:#ff5d73; }
  .tabs { display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:4px; background:var(--card); border-radius:14px; margin:0 0 18px; }
  .tabs button { border:0; border-radius:10px; padding:10px; font:inherit; font-weight:650; font-size:15px; background:transparent; color:var(--muted); }
  .tabs button.on { background:var(--card2); color:var(--text); }
  .ci { background:var(--card); border-radius:18px; overflow:hidden; }
  .ci .cr { display:flex; align-items:center; gap:14px; padding:14px 18px; border-top:1px solid var(--line); }
  .ci .cr:first-child { border-top:0; }
  .ci .cic { width:60px; height:60px; border-radius:50%; background:var(--card2); display:flex; align-items:center; justify-content:center; overflow:hidden; flex:none; }
  .ci .cic img { width:100%; height:100%; object-fit:cover; display:block; }
  .ci .cn { flex:1; } .ci .cn b { display:block; font-weight:650; font-size:16px; } .ci .cn span { color:var(--muted); font-size:13px; }
  .sw { width:52px; height:32px; border-radius:16px; background:var(--card2); border:0; position:relative; padding:0; transition:background .2s; flex:none; }
  .sw::after { content:""; position:absolute; top:3px; left:3px; width:26px; height:26px; border-radius:50%; background:#8b93a3; transition:left .2s, background .2s; }
  .sw.on { background:#3fb7a6; } .sw.on::after { left:23px; background:#0b0d10; }
  .lab { font-size:15px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; margin:34px 2px 14px; }
  .rev { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; }
  .rev button { height:84px; border:0; border-radius:14px; background:var(--c); opacity:.4; transition:opacity .15s, transform .08s; padding:0; }
  .rev button.on { opacity:1; } .rev button:active { transform:scale(.95); }
  .revname { text-align:center; font-size:22px; font-weight:700; margin-top:18px; min-height:30px; }
  .revname.none { color:var(--muted); font-size:15px; font-weight:500; line-height:30px; }
  .wd { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:10px; }
  .wd button { height:58px; border:0; border-radius:14px; background:var(--card2); color:var(--text); font:inherit; font-size:18px; font-weight:650; padding:0; }
  .wd button.on { background:#3fb7a6; color:#0b0d10; font-weight:700; }
  .cimsg { text-align:center; color:var(--muted); font-size:13px; margin-top:28px; min-height:18px; }
  .foot { text-align:center; margin-top:28px; }
  .foot button { border:0; background:none; color:var(--muted); font:inherit; font-size:13px; text-decoration:underline; }
  .trow { display:flex; gap:8px; align-items:stretch; margin:0 0 18px; }
  .trow .tabs { flex:1; margin:0; }
  .logbtn { border:0; border-radius:14px; background:#4f8cff; color:#07101f; font:inherit; font-weight:700; font-size:15px; padding:0 16px; white-space:nowrap; }
  .logbtn:active { transform:scale(.96); }
  .daybtn { position:relative; display:flex; align-items:center; background:var(--card); color:var(--text); }
  .daybtn.past { background:#4f8cff; color:#07101f; }
  .daybtn input { position:absolute; inset:0; width:100%; height:100%; min-width:100%; opacity:0; border:0; margin:0; padding:0; font-size:16px; display:block; -webkit-appearance:none; appearance:none; background:transparent; }
  .daybtn input::-webkit-calendar-picker-indicator { position:absolute; inset:0; width:100%; height:100%; margin:0; padding:0; opacity:0; cursor:pointer; }
  .cday { display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--card); border-radius:14px; padding:10px 14px; margin:0 0 16px; font-size:14px; }
  .cday button { border:0; background:var(--card2); color:var(--text); border-radius:10px; padding:7px 12px; font:inherit; font-size:13px; font-weight:600; }
  .tile { -webkit-touch-callout:none; }
  #toast.ok { background:#2fb86a; color:#04170c; }
  .setup { min-height:70vh; display:flex; flex-direction:column; justify-content:center; gap:14px; }
  .setup .btn { font-size:20px; padding:18px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="logov" hidden></div>
<div class="modal" id="modal"><div class="sheet endsheet">
  <div class="et" id="mT"></div>
  <div class="elab"><span class="el">Ended</span><div class="edr"><div class="eseg" role="group" aria-label="Which day"><button type="button" id="mDy">Yesterday</button><button type="button" id="mDt">Today</button></div>
    <label class="ecal" aria-label="Pick a day"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg><input type="date" id="mCal" aria-label="Pick a day"></label></div></div>
  <div class="epair">
    <div class="ehalf" id="mL"></div>
    <div class="elink"><span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg></span></div>
    <div class="ehalf" id="mR"></div>
  </div>
  <div class="esum" id="mSum"></div>
  <div class="btns">
    <button class="btn pri" id="mSave">Save with this time</button>
    <button class="btn" id="mBack">Still running</button>
    <button class="btn dan" id="mDrop">Discard this entry</button>
  </div>
</div></div>
<div class="modal" id="pick"><div class="sheet">
  <h3 id="pT"></h3><p id="pP"></p>
  <select id="pSel"></select>
  <div class="btns">
    <button class="btn pri" id="pOk"></button>
    <button class="btn dan" id="pDrop">Discard this entry</button>
    <button class="btn" id="pBack">Back</button>
  </div>
</div></div>
<script>
// Settings come from the personal install link (?who=lukas&k=<script id>) and are remembered on the phone.
const NAMES = { lukas: 'Lukáš', michal: 'Michal' };
// Every activity the app knows. limit = hours after which stopping asks "when did you finish?".
const ALL = {
  read:     { label: 'Reading', icon: '📖', color: '#4f8cff' },
  study:    { label: 'Study', icon: '📚', color: '#a66bff' },
  sleep:    { label: 'Sleep', icon: '😴', color: '#3fb7a6', byEnd: true },
  mace:     { label: 'Macebell', icon: '🏏', color: '#ff8a3d' },
  func:     { label: 'Functional', icon: '🤸', color: '#ff5d73' },
  volley:   { label: 'Volleyball', icon: '🏐', color: '#f2c94c' },
  football: { label: 'Football', icon: '⚽', color: '#5cc96b' },
  travel:   { label: 'Travel', icon: '🚗', limit: 6 },
  house:    { label: 'Housework', icon: '🧹' },
  care:     { label: 'Personal care', icon: '🪥' },
  work:     { label: 'School / Work', icon: '🎒', limit: 12 },
  gym:      { label: 'Gym', icon: '🏋️' },
  run:      { label: 'Running', icon: '🏃' },
  walk:     { label: 'Walking', icon: '🚶' },
  bstudy:   { label: 'Business study', icon: '💼' },
  pstudy:   { label: 'Personal study', icon: '🧠' },
  sstudy:   { label: 'School study', icon: '📚' },
  oimprove: { label: 'Other improvement', icon: '🛠️' },
  friends:  { label: 'With friends', icon: '🧑‍🤝‍🧑', limit: 8 },
  waste:    { label: 'Wasting my time', icon: '📱', limit: 6 },
};
// What each person sees. A group with a title gets a header, its own colour and a 3-column grid.
const GROUPS = {
  lukas: [
    { title: 'Basics', color: '#3fb7a6', keys: ['travel', 'house', 'care', 'sleep', 'work'] },
    { title: 'Fitness', color: '#ff8a3d', keys: ['gym', 'func', 'run', 'walk', 'mace', 'volley'] },
    { title: 'Improvement', color: '#a66bff', keys: ['read', 'bstudy', 'pstudy', 'sstudy', 'oimprove'] },
    { title: 'Optional', color: '#ff5d73', keys: ['friends', 'waste'] },
  ],
  michal: [
    { title: 'Basics', color: '#3fb7a6', keys: ['sleep', 'read', 'study'] },
    { title: 'Sport', color: '#ff8a3d', keys: ['football'] },
  ],
};
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
const qs = new URLSearchParams(location.search);
if (qs.get('k')) lsSet('k', qs.get('k'));
if (qs.get('who') && NAMES[qs.get('who').toLowerCase()]) lsSet('who', qs.get('who').toLowerCase());
const KEY = lsGet('k');
let WHO = lsGet('who');
const API = KEY ? 'https://script.google.com/macros/s/' + encodeURIComponent(KEY) + '/exec' : null;

let S = JSON.parse(lsGet('state:' + WHO) || 'null') || { now: Date.now(), running: {}, sessions: [], sync: null };
let offset = 0, busy = {}, loaded = false;
const $ = id => document.getElementById(id);
const act = k => ALL[k] ? Object.assign({ key: k }, ALL[k]) : { key: k, label: k, icon: '•', color: '#888' };
const ymd = ms => { const d = new Date(ms); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const now = () => Date.now() + offset;
const pad = n => String(n).padStart(2, '0');
const hms = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 3600) + ':' + pad(Math.floor(s / 60) % 60) + ':' + pad(s % 60); };
const hm = ms => { const m = Math.round(ms / 60000); return Math.floor(m / 60) + ':' + pad(m % 60); };

const runText = r => r > now() ? 'in ' + mmss(r - now()) : hms(now() - r);
const durLabel = m => m < 60 ? m + ' min' : Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + (m % 60) + ' min' : '');

async function call(fn, ...args) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ api: 'tracker', fn: fn, who: WHO, args: args }) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'error');
  return j.state;
}
function toast(msg, ok) { const t = $('toast'); t.textContent = msg; t.classList.toggle('ok', !!ok); t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 3500); }
function apply(st) { S = st; offset = st.now - Date.now(); loaded = true; lsSet('state:' + WHO, JSON.stringify(st)); render(); }
function fail(e) { toast('That didn’t work — check your internet and try again.'); console.error(e); }

function setupScreen() {
  if (!API) {
    $('app').innerHTML = '<div class="setup"><h1>Tracker</h1><p style="color:var(--muted)">Open your personal link, then add it to your Home Screen.</p></div>';
    return;
  }
  $('app').innerHTML = '<div class="setup"><h1>Who are you?</h1>' +
    Object.keys(NAMES).map(w => '<button class="btn" data-who="' + w + '">' + NAMES[w] + '</button>').join('') + '</div>';
}

// What the other person is doing right now (or what they did last).
function buddyHtml(o) {
  if (!o || !NAMES[o.who]) return '';
  const nm = NAMES[o.who], run = Object.keys(o.running || {}).filter(k => ALL[k]);
  let line, live = false;
  if (run.length) {
    live = true;
    line = run.map(k => { const a = act(k), r = o.running[k];
      return '<div>' + a.icon + ' <b>' + a.label + '</b> <span class="tm" data-run="' + r + '">' + runText(r) + '</span></div>'; }).join('');
  } else if (o.last && ALL[o.last.a]) {
    const a = act(o.last.a), m = Math.max(0, Math.round((now() - o.last.e) / 60000));
    line = '<div>Not tracking right now</div><div class="sub">Last: ' + a.icon + ' ' + a.label + ' · ' + hm(o.last.e - o.last.s) + ', ended ' + (m < 1 ? 'just now' : durLabel(m) + ' ago') + '</div>';
  } else line = '<div>Nothing tracked yet</div>';
  return '<div class="buddy"><span class="av' + (live ? ' live' : '') + '">' + nm[0] + '</span><div class="tx"><div class="sub">' + nm + (live ? ' is doing' : '') + '</div>' + line + '</div></div>';
}

  $('vc').style.display = VIEW === 'c' ? '' : 'none';
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === VIEW));
  $('logbtn').style.display = VIEW === 'c' ? 'none' : '';
  $('daybtn').style.display = VIEW === 'c' ? '' : 'none';
  $('daybtn').classList.toggle('past', !!CID);
  $('daylbl').textContent = '📅 ' + ciDayLabel(CID);
  $('cidate').max = ymd(now()); $('cidate').min = ymd(now() - 60 * 86400000); if ($('cidate').value !== (CID || '')) $('cidate').value = CID || '';
  if (VIEW === 'c') renderCi();
  $('buddy').innerHTML = buddyHtml(S.other);
  const today = ymd(now());
  $('grid').innerHTML = (GROUPS[WHO] || []).map(g => {
    const tiles = g.keys.map(k => {
      const a = act(k), on = S.running[k], wait = on && on > now();
      return '<button class="tile' + (on ? (wait ? ' wait' : ' on') : '') + (busy[k] ? ' busy' : '') + '" style="--c:' + (g.color || a.color) + '" data-k="' + k + '">' +
        '<span class="ic">' + a.icon + '</span><span><div class="lb">' + a.label + '</div>' +
        '<div class="st" data-run="' + (on || '') + '">' + (on ? runText(on) : (loaded ? 'Start' : '…')) + '</div></span></button>';
    }).join('');

    return '<div class="sec" style="--c:' + g.color + '"><h2>' + g.title + '</h2><span class="tot">' + (ms >= 60000 ? 'today ' + hm(ms) : '') + '</span></div>' +

  $('list').innerHTML = S.sessions.length ? S.sessions.map(s => {
    const a = act(s.a), day = new Date(s.s).toDateString() === todayStr ? '' : 'yesterday · ';
    return '<div class="row"><span class="ic">' + a.icon + '</span><div class="tx"><div class="t1">' + a.label + '</div>' +
      '<div class="t2">' + day + clock(s.s) + '–' + clock(s.e) + '</div></div><span class="du">' + hm(s.e - s.s) + '</span>' +
      (S.running && S.running[s.a] ? '' : '<button data-res="' + s.id + '" data-d="' + s.d + '" aria-label="Resume timer" title="Resume timer">↩</button>') +

function tick() { document.querySelectorAll('[data-run]').forEach(el => { const r = Number(el.dataset.run); if (!r) return; if (r <= now() && el.closest('.wait')) return render(); el.textContent = runText(r); }); }

// Scroll wheel (snap list): calls onChange(value) once it settles on a new row. Same feel as the Log screen.
function makeDrum(el, values, fmt, onChange, label) {
  const H = 44; let cur = null, timer = null, drag = null; const items = el.children;
  el.setAttribute('role', 'spinbutton'); el.tabIndex = 0; el.setAttribute('aria-label', label);
  el.innerHTML = values.map(v => '<div class="eit">' + fmt(v) + '</div>').join('');
  const mark = i => { for (let k = 0; k < items.length; k++) items[k].classList.toggle('on', k === i); };
  const idx = () => Math.max(0, Math.min(values.length - 1, Math.round(el.scrollTop / H)));
  function set(v) { let i = values.indexOf(v); if (i < 0) i = 0; cur = values[i]; el.scrollTop = i * H; mark(i); }
  el.addEventListener('scroll', () => { mark(idx()); clearTimeout(timer); timer = setTimeout(() => { const j = idx(); if (values[j] !== cur) { cur = values[j]; onChange(cur); } }, 110); });
  el.addEventListener('click', e => { const it = e.target.closest('.eit'); if (it) el.scrollTo({ top: Array.prototype.indexOf.call(items, it) * H, behavior: 'smooth' }); });
  el.addEventListener('keydown', e => {
    const d = e.key === 'ArrowUp' ? -1 : e.key === 'ArrowDown' ? 1 : e.key === 'PageUp' ? -6 : e.key === 'PageDown' ? 6 : 0; if (!d) return; e.preventDefault();
    el.scrollTo({ top: Math.max(0, Math.min(values.length - 1, idx() + d)) * H, behavior: 'smooth' });
  });
  el.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse') { drag = { y: e.clientY, top: el.scrollTop, moved: false }; el.style.scrollSnapType = 'none'; el.setPointerCapture(e.pointerId); } });
  el.addEventListener('pointermove', e => { if (drag) { const dy = e.clientY - drag.y; if (Math.abs(dy) > 3) drag.moved = true; el.scrollTop = drag.top - dy; } });
  const stop = () => { if (!drag) return; const moved = drag.moved; drag = null; el.style.scrollSnapType = ''; el.scrollTo({ top: idx() * H, behavior: 'smooth' }); if (moved) el.dataset.swallow = '1'; };
  el.addEventListener('pointerup', stop); el.addEventListener('pointercancel', stop);
  el.addEventListener('click', e => { if (el.dataset.swallow) { delete el.dataset.swallow; e.stopImmediatePropagation(); } }, true);
  return { set };
}
function askEnd(a, start) {
  return new Promise(done => {
    const MIN = 60000, H = 44, pad = n => (n < 10 ? '0' : '') + n, base = () => Math.floor(now() / MIN) * MIN;
    const sameDay = (x, y) => new Date(x).toDateString() === new Date(y).toDateString();
    const hmm = ts => { const d = new Date(ts); return d.getHours() + ':' + pad(d.getMinutes()); };
    const dlong = m => { const h = Math.floor(m / 60), r = m % 60; return h ? (r ? h + ' h ' + r + ' min' : h + ' h') : m + ' min'; };
    const ymdOf = ts => { const d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
    const range = n => Array.from({ length: n }, (_, i) => i);
    // sliding wheel (same as the Log screen): scroll-snap list, calls onChange(value) once it settles
    function Drum(el, values, fmt, onChange, label) {
      let cur = null, timer = null; const items = el.children;
      el.setAttribute('role', 'spinbutton'); el.tabIndex = 0; el.setAttribute('aria-label', label);
      el.innerHTML = values.map(v => '<div class="it">' + fmt(v) + '</div>').join('');
      const mark = i => { for (let k = 0; k < items.length; k++) { const on = k === i; if (items[k].classList.contains('on') !== on) items[k].classList.toggle('on', on); } };
      const idxNow = () => Math.max(0, Math.min(values.length - 1, Math.round(el.scrollTop / H)));
      const set = v => { let i = values.indexOf(v); if (i < 0) i = 0; cur = values[i]; el.scrollTop = i * H; mark(i); };
      el.addEventListener('scroll', () => { mark(idxNow()); clearTimeout(timer); timer = setTimeout(() => { const j = idxNow(); if (values[j] !== cur) { cur = values[j]; onChange(cur); } }, 110); });
      el.addEventListener('click', e => { const it = e.target.closest('.it'); if (it) el.scrollTo({ top: Array.prototype.indexOf.call(items, it) * H, behavior: 'smooth' }); });
      el.addEventListener('keydown', e => { const d = e.key === 'ArrowUp' ? -1 : e.key === 'ArrowDown' ? 1 : 0; if (!d) return; e.preventDefault(); el.scrollTo({ top: Math.max(0, Math.min(values.length - 1, idxNow() + d)) * H, behavior: 'smooth' }); });
      let drag = null; // mouse drag (touch scrolls natively)
      el.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse') { drag = { y: e.clientY, top: el.scrollTop, moved: false }; el.style.scrollSnapType = 'none'; el.setPointerCapture(e.pointerId); } });
      el.addEventListener('pointermove', e => { if (drag) { const dy = e.clientY - drag.y; if (Math.abs(dy) > 3) drag.moved = true; el.scrollTop = drag.top - dy; } });
      const endDrag = () => { if (!drag) return; const m = drag.moved; drag = null; el.style.scrollSnapType = ''; el.scrollTo({ top: idxNow() * H, behavior: 'smooth' }); if (m) el.dataset.swallow = '1'; };
      el.addEventListener('pointerup', endDrag); el.addEventListener('pointercancel', endDrag);
      el.addEventListener('click', e => { if (el.dataset.swallow) { delete el.dataset.swallow; e.stopImmediatePropagation(); } }, true);
      return { set };
    }
    let end = base(), openAgo = false, openClock = false, dAH = null, dAM = null, dH = null, dM = null;
    const maxAgo = () => Math.max(0, Math.round((base() - start) / MIN));
    const ago = () => Math.max(0, Math.round((base() - end) / MIN));
    const setEnd = ts => { end = Math.min(ts, base()); };
    const setAgo = n => { end = base() - Math.max(0, Math.min(maxAgo(), n)) * MIN; paint(); };
    const withDay = (ts, dayTs) => { const t = new Date(dayTs), d = new Date(ts); t.setHours(d.getHours(), d.getMinutes(), 0, 0); return t.getTime(); };
    // go to another day, keeping the time; if that lands before the start, end shortly after the start instead
    const goDay = dayTs => { let n = Math.min(withDay(end, dayTs), base()); if (n <= start) n = Math.min(start + 30 * MIN, base()); end = n; paint(); };
    $('mT').innerHTML = a.icon + ' ' + a.label + ' <span>· running for ' + hm(now() - start) + '</span>';

    function paintLeft() {
      const L = $('mL'), n = ago(), h = Math.floor(n / 60);
      if (!openAgo) {
        if (L.dataset.mode !== 'read') {
          L.dataset.mode = 'read';
          L.innerHTML = '<button class="eread" type="button" id="mAgoR" aria-label="Edit how long ago"></button><button class="eu" type="button" id="mAgoU" style="background:none;border:0;font-family:inherit;cursor:pointer"></button>';
          const go = () => { openAgo = true; paint(); };
          $('mAgoR').onclick = go; $('mAgoU').onclick = go;
        }
        $('mAgoR').textContent = n === 0 ? 'now' : h >= 48 ? Math.floor(h / 24) + 'd ' + (h % 24) + 'h' : h ? h + 'h ' + pad(n % 60) : String(n);
        $('mAgoU').textContent = (n === 0 ? 'right now' : h ? 'ago' : 'min ago') + ' · tap to edit';
      } else {
        if (L.dataset.mode !== 'wheels') {
          L.dataset.mode = 'wheels';
          L.innerHTML = '<div class="agos"><div class="wheel" id="mHW"><div class="band"></div><div class="drum" id="mAH"></div></div><div class="wheel"><div class="band"></div><div class="drum" id="mAM"></div></div></div>' +
            '<div class="agol" id="mAgoL"></div><div class="ub"><button class="unit" type="button" id="mAddH">＋ Add hours</button><button class="unit done" type="button" id="mADone">Done</button></div>';
          dAH = Drum($('mAH'), range(Math.floor(maxAgo() / 60) + 1), String, v => setAgo(v * 60 + ago() % 60), 'Hours ago');
          dAM = Drum($('mAM'), range(60), String, v => setAgo(Math.floor(ago() / 60) * 60 + v), 'Minutes ago');
          $('mAddH').onclick = () => { if (ago() < 60) setAgo(ago() + 60); };
          $('mADone').onclick = () => { openAgo = false; paint(); };
        }
        $('mHW').hidden = h === 0; $('mAddH').hidden = h > 0 || maxAgo() < 60;
        $('mAgoL').textContent = h > 0 ? 'hours · minutes ago' : (n === 0 ? 'minutes ago · now' : 'minutes ago');
        dAH.set(h); dAM.set(n % 60);
      }
    }
    function paintRight() {
      const R = $('mR'), d = new Date(end), today = sameDay(end, base()), yest = sameDay(end, base() - 86400000);
      if (!openClock) {
        if (R.dataset.mode !== 'read') {
          R.dataset.mode = 'read';
          R.innerHTML = '<button class="eread" type="button" id="mClkR" aria-label="Edit end time"></button><button class="eu" type="button" id="mAtU" style="background:none;border:0;font-family:inherit;cursor:pointer"></button>';
          const go = () => { openClock = true; paint(); };
          $('mClkR').onclick = go; $('mAtU').onclick = go;
        }
        $('mClkR').textContent = hmm(end);
        $('mAtU').textContent = (today ? 'ended' : yest ? 'yesterday' : d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })) + ' · tap to edit';
      } else {
        if (R.dataset.mode !== 'drums') {
          R.dataset.mode = 'drums';
          R.innerHTML = '<div class="drums"><div class="wheel"><div class="band"></div><div class="drum" id="mCH"></div></div><div class="colon">:</div><div class="wheel"><div class="band"></div><div class="drum" id="mCM"></div></div></div><button class="unit done" type="button" id="mCDone">Done</button>';
          const commit = (hh, mm) => { const t = new Date(end); t.setHours(hh, mm, 0, 0); let ms = t.getTime(); if (ms > base()) ms -= 86400000; end = ms; paint(); };
          dH = Drum($('mCH'), range(24), String, v => commit(v, new Date(end).getMinutes()), 'Hour');
          dM = Drum($('mCM'), range(60), pad, v => commit(new Date(end).getHours(), v), 'Minute');
          $('mCDone').onclick = () => { openClock = false; paint(); };
        }
        dH.set(d.getHours()); dM.set(d.getMinutes());
      }
    }
    function paint() {
      paintLeft(); paintRight();
      const today = sameDay(end, base()), yest = sameDay(end, base() - 86400000);
      $('mDt').setAttribute('aria-pressed', today); $('mDy').setAttribute('aria-pressed', yest);
      $('mDy').disabled = sameDay(start, base()); // started today: it can't have ended yesterday
      $('mDy').title = $('mDy').disabled ? 'It started today' : '';
      $('mCal').min = ymdOf(start); $('mCal').max = ymdOf(base()); $('mCal').value = ymdOf(end);
      const bad = end <= start;
      $('mSum').className = 'esum' + (bad ? ' bad' : '');
      $('mSum').textContent = bad ? 'The end is before the start' : hmm(start) + ' – ' + hmm(end) + ' · ' + dlong(Math.round((end - start) / MIN));
      $('mSave').disabled = bad;
    }
    $('mL').dataset.mode = ''; $('mR').dataset.mode = ''; $('mL').innerHTML = ''; $('mR').innerHTML = '';
    $('modal').classList.add('show');
    const close = v => { $('modal').classList.remove('show'); done(v); };
    $('mDt').onclick = () => goDay(base());
    $('mDy').onclick = () => { if (!$('mDy').disabled) goDay(base() - 86400000); };
    $('mCal').onchange = () => { const v = $('mCal').value; if (!v) return; const p = v.split('-'); goDay(new Date(+p[0], +p[1] - 1, +p[2]).getTime()); };
    $('mSave').onclick = () => { if (end <= start) return; close(end === base() ? null : end); };
    $('mDrop').onclick = () => close('drop');
    $('mBack').onclick = () => close(undefined);
    paint();
  });
}
function pick(o) {
  return new Promise(done => {
    $('pT').textContent = o.title; $('pP').textContent = o.text; $('pOk').textContent = o.ok;
    $('pSel').innerHTML = o.items.map(it => '<option value="' + it[0] + '">' + it[1] + '</option>').join('');
    $('pSel').value = String(o.value);
    $('pDrop').style.display = o.drop ? 'block' : 'none';
    $('pick').classList.add('show');
    const close = v => { $('pick').classList.remove('show'); done(v); };
    $('pOk').onclick = () => close(Number($('pSel').value));
    $('pDrop').onclick = () => close('drop');
    $('pBack').onclick = () => close(undefined);
  });
}

// Sleep: pick a delay when starting (timer starts by itself), pick "woke up X min ago" when stopping.
async function sleepTap(key, start) {
  if (!start) {
    const v = await pick({ title: '😴 Sleep', text: 'When will you fall asleep? The timer starts by itself.', ok: 'Start',
      items: [0, 5, 10, 15, 20, 25, 30, 40, 45, 60, 75, 90].map(m => [m, m ? 'in ' + durLabel(m) : 'Now']), value: lsGet('sleepDelay') || 0 });
    if (v === undefined) return;
    lsSet('sleepDelay', v);
    S.running[key] = now() + v * 60000; render();
    return apply(await call('start', key, v));
  }
  if (start > now()) {
    if (!confirm('Cancel the sleep countdown?')) return;
    return apply(await call('cancel', key));
  }
  const v = await pick({ title: '☀️ Good morning', text: 'When did you wake up?', ok: 'Save sleep', drop: true,
    items: [0, 5, 10, 15, 20, 25, 30, 40, 45, 50, 60, 75, 90, 105, 120, 150, 180, 240].map(m => [m, m ? durLabel(m) + ' ago' : 'Just now']), value: 0 });
  if (v === undefined) return;
  if (v === 'drop') return apply(await call('cancel', key));
  const end = now() - v * 60000;
  if (end - start < 60000) { toast('Wake-up has to be after falling asleep.'); return; }
  delete S.running[key]; render();
  apply(await call('stop', key, v ? end : null));
}

async function tap(key) {
  if (busy[key] || !loaded) return;
  const a = act(key), start = S.running[key];
  busy[key] = true;
  try {
    if (a.byEnd) return await sleepTap(key, start);
    if (!start) {
      S.running[key] = now(); render();
      apply(await call('start', key));
    } else {
      let end = null;
      if (now() - start > (a.limit || 3) * 3600000) {
        end = await askEnd(a, start);
        if (end === undefined) return;
        if (end === 'drop') { apply(await call('cancel', key)); return; }
      }
      delete S.running[key]; render();
      apply(await call('stop', key, end));
    }
  } catch (e) { fail(e); refresh(); }
  finally { busy[key] = false; render(); }
}
async function resume(id, d) {
  if (!confirm('Resume this timer from its original start? The saved entry goes back to running.')) return;
  try { apply(await call('resume', d, id)); } catch (e) { fail(e); }
}
async function del(id, d) {
  if (!confirm('Delete this entry? Notion will be updated.')) return;
  try { apply(await call('del', d, id)); } catch (e) { fail(e); }
}

const SW = [
  ['diet', 'Diet', 'Stuck to the plan', '#5cc96b', 'img:diet.jpg'],
  ['supp', 'Supplements', 'Took them today', '#a66bff', 'img:supp.jpg'],
  ['quit', 'Quit', 'Stayed clean today', '#ff5d73', 'img:quit.jpg'],
  ['zmrd', 'Najman je zmrd', 'Byl otravnej', '#ffd05c', 'img:najman.jpg'],
];
let VIEW = lsGet('view') === 'c' ? 'c' : 't';
let CI = null, ciPending = 0, ciMsg = '', CID = null, ciLoading = false; // CID: chosen past day (YYYY-MM-DD), null = today
const ciDay = () => CID || ymd(now());
function ciDayLabel(d, long) {
  if (!d || d === ymd(now())) return 'Today';
  if (d === ymd(now() - 86400000)) return 'Yesterday';
  return new Date(d + 'T12:00:00').toLocaleDateString('en-GB', long ? { weekday: 'long', day: 'numeric', month: 'long' } : { day: 'numeric', month: 'short' });
}
const ciBlank = () => ({ date: ciDay(), diet: false, supp: false, quit: false, review: null, wordle: null });
function ciCache() {
  if (CI && CI.date === ciDay()) return CI;
  if (!CID) try { const c = JSON.parse(lsGet('ci:' + WHO) || 'null'); if (c && c.date === ymd(now())) return (CI = c); } catch (e) {}
  return null;
}
function renderCi() {
  const el = $('vc'); if (!el) return;
  const c = ciCache() || ciBlank();
  const rows = SW.map(r => '<div class="cr"><div class="cic">' + (r[4].slice(0, 4) === 'img:' ? '<img src="' + r[4].slice(4) + '" alt="">' : r[4][0] === '<' ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="' + r[3] +
    '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + r[4] + '</svg>' : '<span style="font-size:20px;line-height:1">' + r[4] + '</span>') + '</div>' +
    '<div class="cn"><b>' + r[1] + '</b><span>' + (CID ? r[2].replace('today', 'that day') : r[2]) + '</span></div>' +
    '<button class="sw' + (c[r[0]] ? ' on' : '') + '" data-ci="' + r[0] + '" aria-pressed="' + !!c[r[0]] + '" aria-label="' + r[1] + '"></button></div>').join('');
  const rev = REVIEW.map(r => '<button class="' + (c.review === r[0] ? 'on' : '') + '" style="--c:' + r[1] + '" data-ci="review" data-val="' + r[0] +
    '" aria-pressed="' + (c.review === r[0]) + '" aria-label="' + r[0] + '"></button>').join('');
  const wd = WORDLE.map(w => '<button class="' + (c.wordle === w ? 'on' : '') + '" data-ci="wordle" data-val="' + w + '" aria-pressed="' + (c.wordle === w) +
    '"' + (w === 'Failed' ? ' aria-label="Failed"' : '') + '>' + (w === 'Failed' ? 'X' : w) + '</button>').join('');
  el.innerHTML = (CID ? '<div class="cday"><span>Editing <b>' + ciDayLabel(CID, true) + '</b></span><button data-ciday="today">Back to today</button></div>' : '') +
    '<div' + (ciLoading ? ' style="opacity:.4;pointer-events:none"' : '') + '><div class="ci">' + rows + '</div>' +
    '<div class="lab">How was your day?</div><div class="rev">' + rev + '</div>' +
    '<div class="revname' + (c.review ? '' : ' none') + '">' + (c.review || 'Tap how it went') + '</div>' +
    '<div class="lab">Wordle</div><div class="wd">' + wd + '</div></div>' +
    '<div class="cimsg">' + (ciLoading ? 'Loading…' : ciMsg) + '</div>';
}
async function ciTap(field, val) {
  const c = ciCache() || (CI = ciBlank());
  if (c.date !== ciDay()) { CI = ciBlank(); }
  const day = CID;
  const cur = CI[field];
  CI[field] = (field === 'review' || field === 'wordle') ? (cur === val ? null : val) : !cur;
  const nv = CI[field];
  if (field === 'quit' && CI.streak != null) CI.streak = Math.max(0, CI.streak + (nv ? 1 : -1));
  ciMsg = 'Saving…'; if (!day) lsSet('ci:' + WHO, JSON.stringify(CI)); renderCi();
  ciPending++;
  try { const r = await call('ciSet', field, nv, day); if (day === CID) { if (r && r.ci && r.ci.streak != null) CI.streak = r.ci.streak; if (!day) lsSet('ci:' + WHO, JSON.stringify(CI)); } ciPending--; if (!ciPending) { ciMsg = 'Saved to Notion'; if (VIEW === 'c') renderCi(); } }
  catch (e) { ciPending--; ciMsg = ''; fail(e); refreshCi(true); }
}
async function refreshCi(force) {
  if (!API || !WHO || (ciPending && !force)) return;
  const day = CID;
  try {
    const r = await call('ciGet', day);
    if (day !== CID || (ciPending && !force)) return;
    CI = r.ci; if (!day) lsSet('ci:' + WHO, JSON.stringify(CI));
    ciLoading = false; if (VIEW === 'c') renderCi();
  } catch (e) { if (day === CID && ciLoading) { ciLoading = false; if (VIEW === 'c') renderCi(); toast('Can’t load that day — check your internet.'); } }
}
function setCiDay(d) {
  const today = ymd(now());
  CID = (!d || d >= today) ? null : d; CI = null; ciMsg = ''; ciLoading = true;
  render(); refreshCi(true);
}
function setView(v) { VIEW = v; lsSet('view', v); render(); if (v === 'c') refreshCi(); window.scrollTo(0, 0); }
async function refresh() {
  if (!API || !WHO) return;
  try { apply(await call('state')); } catch (e) { if (!loaded) toast('Can’t connect — check your internet.'); }
  if (VIEW === 'c') refreshCi();
}

let lastPtr = '';
document.addEventListener('pointerdown', e => { lastPtr = e.pointerType; }, true);
document.addEventListener('click', e => {
  const w = e.target.closest('[data-who]');
  if (w) { WHO = w.dataset.who; lsSet('who', WHO); S = JSON.parse(lsGet('state:' + WHO) || 'null') || { now: Date.now(), running: {}, sessions: [], sync: null }; loaded = false; CI = null; CID = null; ciLoading = false; ciMsg = ''; $('app').innerHTML = ''; render(); return refresh(); }
  if (e.target.id === 'switch') { if (confirm('Switch to the other person?')) { WHO = null; lsSet('who', ''); $('app').innerHTML = ''; render(); } return; }
  if (e.target.closest('#logbtn')) return Log.open();
  if (e.target.closest('#daybtn')) {
    // Phones open their own date wheel when the (invisible) field is tapped; on a computer the browser only
    // opens it from a tiny icon, so open it ourselves wherever the button was clicked.
    const i = $('cidate');
    if (e.target === i && lastPtr === 'touch') return;
    e.preventDefault();
    try { if (i.showPicker) { i.showPicker(); return; } } catch (err) {}
    i.focus(); return;
  }
  if (e.target.closest('[data-ciday]')) return setCiDay(null);
  const v = e.target.closest('[data-v]'); if (v) return setView(v.dataset.v);
  const ci = e.target.closest('[data-ci]'); if (ci) return ciTap(ci.dataset.ci, ci.dataset.val);
  const t = e.target.closest('[data-k]'); if (t) { if (lpFired) { lpFired = false; return; } return tap(t.dataset.k); }
  const rs = e.target.closest('[data-res]'); if (rs) return resume(rs.dataset.res, rs.dataset.d);
  const d = e.target.closest('[data-del]'); if (d) return del(d.dataset.del, d.dataset.d);
});
// Long-press a RUNNING tile: pick when it really ended (forgot to stop). Any other tile: open the Log screen.
async function longPress(key) {
  const a = act(key), start = S.running[key];
  if (!start || start > now() || busy[key] || !loaded) return Log.open(key);
  if (a.byEnd) return tap(key); // sleep already asks "when did you wake up?"
  busy[key] = true;
  try {
    const end = await askEnd(a, start);
    if (end === undefined) return;
    if (end === 'drop') { apply(await call('cancel', key)); return; }
    delete S.running[key]; render();
    apply(await call('stop', key, end));
  } catch (e) { fail(e); refresh(); }
  finally { busy[key] = false; render(); }
}
// Long-press a tile (about half a second).
let lpTimer = null, lpFired = false, lpX = 0, lpY = 0;
const lpClear = () => { clearTimeout(lpTimer); lpTimer = null; };
document.addEventListener('pointerdown', e => {
  const t = e.target.closest('[data-k]'); if (!t || e.button > 0) return;
  lpFired = false; lpX = e.clientX; lpY = e.clientY; lpClear();
  lpTimer = setTimeout(() => { lpFired = true; lpTimer = null; if (navigator.vibrate) navigator.vibrate(15); longPress(t.dataset.k); setTimeout(() => { lpFired = false; }, 700); }, 550);
});
document.addEventListener('pointermove', e => { if (lpTimer && Math.hypot(e.clientX - lpX, e.clientY - lpY) > 10) lpClear(); });
['pointerup', 'pointercancel'].forEach(n => document.addEventListener(n, lpClear));
document.addEventListener('contextmenu', e => { if (e.target.closest('[data-k]')) e.preventDefault(); });
document.addEventListener('change', e => { if (e.target.id === 'cidate' && e.target.value) setCiDay(e.target.value); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
setInterval(tick, 1000); setInterval(refresh, 60000);
// Updates: check for a new version on every open and reload straight into it (no second launch needed).
if ('serviceWorker' in navigator) {
  const hadSW = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadSW && !reloaded) { reloaded = true; location.reload(); } });
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.update().catch(() => {});
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
  }).catch(() => {});
}
render(); refresh();
</script>
<script src="log.js"></script>
</body>
