<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tracker">
<meta name="theme-color" content="#0f1115">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Tracker</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --card2:#22262f; --text:#e9edf3; --muted:#8b93a3; --line:#2a2f39; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { background:var(--bg); }
  body { margin:0; background:var(--bg); color:var(--text); font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
         padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 32px); -webkit-user-select:none; user-select:none; }
  header { display:flex; align-items:baseline; justify-content:space-between; margin:4px 2px 18px; }
  h1 { font-size:26px; margin:0; font-weight:700; letter-spacing:-.3px; }
  .date { color:var(--muted); font-size:14px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .grid.g3 { grid-template-columns:repeat(3, 1fr); gap:10px; }
  .g3 .tile { min-height:94px; padding:12px 11px; border-radius:18px; }
  .g3 .tile .ic { font-size:24px; }
  .g3 .tile .lb { font-size:14px; line-height:1.2; }
  .g3 .tile .st { font-size:12px; }
  .g3 .tile.on .st, .g3 .tile.wait .st { font-size:16px; }
  .g3 .tile.on::after { top:11px; right:11px; width:8px; height:8px; }
  .sec { display:flex; justify-content:space-between; align-items:baseline; margin:22px 2px 10px; }
  .sec:first-child { margin-top:0; }
  .sec h2 { margin:0; color:var(--c); }
  .sec .tot { color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; }
  .tile { position:relative; border:0; border-radius:20px; background:var(--card); color:var(--text); padding:16px; min-height:112px; text-align:left;
          display:flex; flex-direction:column; justify-content:space-between; font:inherit; cursor:pointer; transition:transform .08s, background .2s; overflow:hidden; }
  .tile:active { transform:scale(.97); }
  .tile .ic { font-size:30px; line-height:1; }
  .tile .lb { font-weight:650; font-size:17px; }
  .tile .st { color:var(--muted); font-size:13px; margin-top:2px; font-variant-numeric:tabular-nums; }
  .tile.on { background:var(--c); color:#0b0d10; }
  .tile.on .st { color:#0b0d10; font-weight:700; font-size:20px; }
  .tile.on::after { content:""; position:absolute; top:14px; right:14px; width:10px; height:10px; border-radius:50%; background:#0b0d10; animation:pulse 1.2s infinite; }
  .tile.wait { background:var(--card2); box-shadow:inset 0 0 0 2px var(--c); }
  .tile.wait .st { color:var(--text); font-weight:700; font-size:18px; }
  .tile.busy { opacity:.6; }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.25 } }
  h2 { font-size:15px; color:var(--muted); font-weight:600; margin:26px 2px 10px; text-transform:uppercase; letter-spacing:.6px; }
  .list { background:var(--card); border-radius:18px; overflow:hidden; }
  .row { display:flex; align-items:center; gap:12px; padding:13px 14px; border-top:1px solid var(--line); }
  .row:first-child { border-top:0; }
  .row .ic { font-size:20px; width:26px; text-align:center; }
  .row .tx { flex:1; min-width:0; }
  .row .t1 { font-weight:600; }
  .row .t2 { color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; }
  .row .du { font-variant-numeric:tabular-nums; font-weight:600; }
  .row button { border:0; background:var(--card2); color:var(--muted); width:32px; height:32px; border-radius:10px; font-size:16px; }
  .empty { color:var(--muted); padding:16px; text-align:center; font-size:14px; }
  .warn { background:#3a2a12; color:#ffcf8a; border-radius:14px; padding:12px 14px; font-size:14px; margin-bottom:14px; display:none; }
  #toast { position:fixed; left:16px; right:16px; bottom:calc(env(safe-area-inset-bottom) + 20px); background:#ff5d73; color:#fff; padding:14px 16px; border-radius:14px; font-weight:600;
           transform:translateY(calc(100% + 60px)); visibility:hidden; transition:transform .25s, visibility .25s; z-index:20; }
  #toast.show { transform:none; visibility:visible; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:flex-end; z-index:10; }
  .modal.show { display:flex; }
  .sheet { background:var(--card); width:100%; border-radius:22px 22px 0 0; padding:22px 18px calc(env(safe-area-inset-bottom) + 24px); }
  .sheet h3 { margin:0 0 6px; font-size:20px; }
  .sheet p { margin:0 0 16px; color:var(--muted); }
  .sheet input, .sheet select { width:100%; font:inherit; font-size:22px; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--text); margin-bottom:14px; }
  .sheet select { font-size:24px; font-weight:600; padding:14px 12px; border-radius:14px; -webkit-appearance:none; appearance:none; text-align:center; text-align-last:center; }
  .btns { display:grid; gap:10px; }
  .btn { border:0; border-radius:14px; padding:15px; font:inherit; font-weight:650; background:var(--card2); color:var(--text); }
  .btn.pri { background:#4f8cff; color:#fff; }
  .btn.dan { background:transparent; color:#ff5d73; }
  .tabs { display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:4px; background:var(--card); border-radius:14px; margin:0 0 18px; }
  .tabs button { border:0; border-radius:10px; padding:10px; font:inherit; font-weight:650; font-size:15px; background:transparent; color:var(--muted); }
  .tabs button.on { background:var(--card2); color:var(--text); }
  .ci { background:var(--card); border-radius:18px; overflow:hidden; }
  .ci .cr { display:flex; align-items:center; gap:12px; padding:14px 16px; border-top:1px solid var(--line); }
  .ci .cr:first-child { border-top:0; }
  .ci .cic { width:38px; height:38px; border-radius:50%; background:var(--card2); display:flex; align-items:center; justify-content:center; }
  .ci .cn { flex:1; } .ci .cn b { display:block; font-weight:650; font-size:16px; } .ci .cn span { color:var(--muted); font-size:13px; }
  .sw { width:52px; height:32px; border-radius:16px; background:var(--card2); border:0; position:relative; padding:0; transition:background .2s; flex:none; }
  .sw::after { content:""; position:absolute; top:3px; left:3px; width:26px; height:26px; border-radius:50%; background:#8b93a3; transition:left .2s, background .2s; }
  .sw.on { background:#3fb7a6; } .sw.on::after { left:23px; background:#0b0d10; }
  .lab { font-size:15px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; margin:24px 2px 10px; }
  .rev { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; }
  .rev button { height:64px; border:0; border-radius:14px; background:var(--c); opacity:.4; transition:opacity .15s, transform .08s; padding:0; }
  .rev button.on { opacity:1; } .rev button:active { transform:scale(.95); }
  .revname { text-align:center; font-size:20px; font-weight:700; margin-top:12px; min-height:26px; }
  .revname.none { color:var(--muted); font-size:15px; font-weight:500; line-height:26px; }
  .wd { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:8px; }
  .wd button { height:48px; border:0; border-radius:14px; background:var(--card2); color:var(--text); font:inherit; font-size:18px; font-weight:650; padding:0; }
  .wd button.on { background:#3fb7a6; color:#0b0d10; font-weight:700; }
  .cimsg { text-align:center; color:var(--muted); font-size:13px; margin-top:22px; min-height:18px; }
  .foot { text-align:center; margin-top:28px; }
  .foot button { border:0; background:none; color:var(--muted); font:inherit; font-size:13px; text-decoration:underline; }
  .setup { min-height:70vh; display:flex; flex-direction:column; justify-content:center; gap:14px; }
  .setup .btn { font-size:20px; padding:18px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div class="modal" id="modal"><div class="sheet">
  <h3 id="mT"></h3><p>When did you finish?</p>
  <input type="time" id="mTime">
  <div class="btns">
    <button class="btn pri" id="mSave">Save with this time</button>
    <button class="btn" id="mNow">I just finished</button>
    <button class="btn dan" id="mDrop">Discard this entry</button>
    <button class="btn" id="mBack">Back</button>
  </div>
</div></div>
<div class="modal" id="pick"><div class="sheet">
  <h3 id="pT"></h3><p id="pP"></p>
  <select id="pSel"></select>
  <div class="btns">
    <button class="btn pri" id="pOk"></button>
    <button class="btn dan" id="pDrop">Discard this entry</button>
    <button class="btn" id="pBack">Back</button>
  </div>
</div></div>
<script>
// Settings come from the personal install link (?who=lukas&k=<script id>) and are remembered on the phone.
const NAMES = { lukas: 'Lukáš', michal: 'Michal' };
// Every activity the app knows. limit = hours after which stopping asks "when did you finish?".
const ALL = {
  read:     { label: 'Reading', icon: '📖', color: '#4f8cff' },
  study:    { label: 'Study', icon: '📚', color: '#a66bff' },
  sleep:    { label: 'Sleep', icon: '😴', color: '#3fb7a6', byEnd: true },
  mace:     { label: 'Macebell', icon: '🏏', color: '#ff8a3d' },
  func:     { label: 'Functional', icon: '🤸', color: '#ff5d73' },
  volley:   { label: 'Volleyball', icon: '🏐', color: '#f2c94c' },
  football: { label: 'Football', icon: '⚽', color: '#5cc96b' },
  travel:   { label: 'Travel', icon: '🚗', limit: 6 },
  house:    { label: 'Housework', icon: '🧹' },
  care:     { label: 'Personal care', icon: '🪥' },
  work:     { label: 'School / Work', icon: '🎒', limit: 12 },
  gym:      { label: 'Gym', icon: '🏋️' },
  run:      { label: 'Running', icon: '🏃' },
  walk:     { label: 'Walking', icon: '🚶' },
  bstudy:   { label: 'Business study', icon: '💼' },
  pstudy:   { label: 'Personal study', icon: '🧠' },
  sstudy:   { label: 'School study', icon: '📚' },
  oimprove: { label: 'Other improvement', icon: '🛠️' },
  friends:  { label: 'With friends', icon: '🧑‍🤝‍🧑', limit: 8 },
  waste:    { label: 'Wasting my time', icon: '📱', limit: 6 },
};
// What each person sees. A group with a title gets a header, its own colour and a 3-column grid.
const GROUPS = {
  lukas: [
    { title: 'Basics', color: '#3fb7a6', keys: ['travel', 'house', 'care', 'sleep', 'work'] },
    { title: 'Fitness', color: '#ff8a3d', keys: ['gym', 'func', 'run', 'walk', 'mace', 'volley'] },
    { title: 'Improvement', color: '#a66bff', keys: ['read', 'bstudy', 'pstudy', 'sstudy', 'oimprove'] },
    { title: 'Optional', color: '#ff5d73', keys: ['friends', 'waste'] },
  ],
  michal: [
    { title: 'Basics', color: '#3fb7a6', keys: ['sleep', 'read', 'study'] },
    { title: 'Sport', color: '#ff8a3d', keys: ['football'] },
  ],
};
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
const qs = new URLSearchParams(location.search);
if (qs.get('k')) lsSet('k', qs.get('k'));
if (qs.get('who') && NAMES[qs.get('who').toLowerCase()]) lsSet('who', qs.get('who').toLowerCase());
const KEY = lsGet('k');
let WHO = lsGet('who');
const API = KEY ? 'https://script.google.com/macros/s/' + encodeURIComponent(KEY) + '/exec' : null;

let S = JSON.parse(lsGet('state:' + WHO) || 'null') || { now: Date.now(), running: {}, sessions: [], sync: null };
let offset = 0, busy = {}, loaded = false;
const $ = id => document.getElementById(id);
const act = k => ALL[k] ? Object.assign({ key: k }, ALL[k]) : { key: k, label: k, icon: '•', color: '#888' };
const ymd = ms => { const d = new Date(ms); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const now = () => Date.now() + offset;
const pad = n => String(n).padStart(2, '0');
const hms = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 3600) + ':' + pad(Math.floor(s / 60) % 60) + ':' + pad(s % 60); };
const hm = ms => { const m = Math.round(ms / 60000); return Math.floor(m / 60) + ':' + pad(m % 60); };
const clock = ms => { const d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const mmss = ms => { const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ':' + pad(s % 60); };
const runText = r => r > now() ? 'in ' + mmss(r - now()) : hms(now() - r);
const durLabel = m => m < 60 ? m + ' min' : Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + (m % 60) + ' min' : '');

async function call(fn, ...args) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ api: 'tracker', fn: fn, who: WHO, args: args }) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'error');
  return j.state;
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 3500); }
function apply(st) { S = st; offset = st.now - Date.now(); loaded = true; lsSet('state:' + WHO, JSON.stringify(st)); render(); }
function fail(e) { toast('That didn’t work — check your internet and try again.'); console.error(e); }

function setupScreen() {
  if (!API) {
    $('app').innerHTML = '<div class="setup"><h1>Tracker</h1><p style="color:var(--muted)">Open your personal link, then add it to your Home Screen.</p></div>';
    return;
  }
  $('app').innerHTML = '<div class="setup"><h1>Who are you?</h1>' +
    Object.keys(NAMES).map(w => '<button class="btn" data-who="' + w + '">' + NAMES[w] + '</button>').join('') + '</div>';
}

function render() {
  if (!API || !WHO) return setupScreen();
  if (!$('grid')) {
    $('app').innerHTML = '<header><h1 id="hi"></h1><span class="date" id="date"></span></header>' +
      '<div class="tabs" id="tabs"><button data-v="t">Timers</button><button data-v="c">Check-in</button></div>' +
      '<div id="vt"><div class="warn" id="warn">The last save to Notion failed — retrying in a few minutes.</div>' +
      '<div id="grid"></div><h2>Today &amp; yesterday</h2><div class="list" id="list"></div></div>' +
      '<div id="vc"></div>' +
      '<div class="foot"><button id="switch">Not ' + NAMES[WHO] + '? Switch</button></div>';
  }
  $('hi').textContent = 'Hi, ' + NAMES[WHO];
  $('date').textContent = new Date(now()).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short' });
  $('warn').style.display = S.sync ? 'block' : 'none';
  $('vt').style.display = VIEW === 'c' ? 'none' : '';
  $('vc').style.display = VIEW === 'c' ? '' : 'none';
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === VIEW));
  if (VIEW === 'c') renderCi();
  const today = ymd(now());
  $('grid').innerHTML = (GROUPS[WHO] || []).map(g => {
    const tiles = g.keys.map(k => {
      const a = act(k), on = S.running[k], wait = on && on > now();
      return '<button class="tile' + (on ? (wait ? ' wait' : ' on') : '') + (busy[k] ? ' busy' : '') + '" style="--c:' + (g.color || a.color) + '" data-k="' + k + '">' +
        '<span class="ic">' + a.icon + '</span><span><div class="lb">' + a.label + '</div>' +
        '<div class="st" data-run="' + (on || '') + '">' + (on ? runText(on) : (loaded ? 'Start' : '…')) + '</div></span></button>';
    }).join('');
    if (!g.title) return '<div class="grid">' + tiles + '</div>';
    const ms = S.sessions.filter(x => x.d === today && g.keys.indexOf(x.a) >= 0).reduce((t, x) => t + x.e - x.s, 0);
    return '<div class="sec" style="--c:' + g.color + '"><h2>' + g.title + '</h2><span class="tot">' + (ms >= 60000 ? 'today ' + hm(ms) : '') + '</span></div>' +
      '<div class="grid g3">' + tiles + '</div>';
  }).join('');
  const todayStr = new Date(now()).toDateString();
  $('list').innerHTML = S.sessions.length ? S.sessions.map(s => {
    const a = act(s.a), day = new Date(s.s).toDateString() === todayStr ? '' : 'yesterday · ';
    return '<div class="row"><span class="ic">' + a.icon + '</span><div class="tx"><div class="t1">' + a.label + '</div>' +
      '<div class="t2">' + day + clock(s.s) + '–' + clock(s.e) + '</div></div><span class="du">' + hm(s.e - s.s) + '</span>' +
      '<button data-del="' + s.id + '" data-d="' + s.d + '" aria-label="Delete">✕</button></div>';
  }).join('') : '<div class="empty">' + (loaded ? 'Nothing yet. Tap an activity to start.' : 'Loading…') + '</div>';
}
function tick() { document.querySelectorAll('[data-run]').forEach(el => { const r = Number(el.dataset.run); if (!r) return; if (r <= now() && el.closest('.wait')) return render(); el.textContent = runText(r); }); }

function askEnd(a, start) {
  return new Promise(done => {
    $('mT').textContent = a.icon + ' ' + a.label + ' running for ' + hm(now() - start);
    $('mTime').value = clock(now());
    $('modal').classList.add('show');
    const close = v => { $('modal').classList.remove('show'); done(v); };
    $('mSave').onclick = () => {
      const [h, m] = ($('mTime').value || '').split(':').map(Number);
      if (isNaN(h)) return close(null);
      const d = new Date(now()); d.setHours(h, m, 0, 0);
      let ms = d.getTime(); if (ms > now()) ms -= 86400000;
      if (ms <= start) { toast('That time is before the start.'); return; }
      close(ms);
    };
    $('mNow').onclick = () => close(null);
    $('mDrop').onclick = () => close('drop');
    $('mBack').onclick = () => close(undefined);
  });
}
function pick(o) {
  return new Promise(done => {
    $('pT').textContent = o.title; $('pP').textContent = o.text; $('pOk').textContent = o.ok;
    $('pSel').innerHTML = o.items.map(it => '<option value="' + it[0] + '">' + it[1] + '</option>').join('');
    $('pSel').value = String(o.value);
    $('pDrop').style.display = o.drop ? 'block' : 'none';
    $('pick').classList.add('show');
    const close = v => { $('pick').classList.remove('show'); done(v); };
    $('pOk').onclick = () => close(Number($('pSel').value));
    $('pDrop').onclick = () => close('drop');
    $('pBack').onclick = () => close(undefined);
  });
}

// Sleep: pick a delay when starting (timer starts by itself), pick "woke up X min ago" when stopping.
async function sleepTap(key, start) {
  if (!start) {
    const v = await pick({ title: '😴 Sleep', text: 'When will you fall asleep? The timer starts by itself.', ok: 'Start',
      items: [0, 5, 10, 15, 20, 25, 30, 40, 45, 60, 75, 90].map(m => [m, m ? 'in ' + durLabel(m) : 'Now']), value: lsGet('sleepDelay') || 0 });
    if (v === undefined) return;
    lsSet('sleepDelay', v);
    S.running[key] = now() + v * 60000; render();
    return apply(await call('start', key, v));
  }
  if (start > now()) {
    if (!confirm('Cancel the sleep countdown?')) return;
    return apply(await call('cancel', key));
  }
  const v = await pick({ title: '☀️ Good morning', text: 'When did you wake up?', ok: 'Save sleep', drop: true,
    items: [0, 5, 10, 15, 20, 25, 30, 40, 45, 50, 60, 75, 90, 105, 120, 150, 180, 240].map(m => [m, m ? durLabel(m) + ' ago' : 'Just now']), value: 0 });
  if (v === undefined) return;
  if (v === 'drop') return apply(await call('cancel', key));
  const end = now() - v * 60000;
  if (end - start < 60000) { toast('Wake-up has to be after falling asleep.'); return; }
  delete S.running[key]; render();
  apply(await call('stop', key, v ? end : null));
}

async function tap(key) {
  if (busy[key] || !loaded) return;
  const a = act(key), start = S.running[key];
  busy[key] = true;
  try {
    if (a.byEnd) return await sleepTap(key, start);
    if (!start) {
      S.running[key] = now(); render();
      apply(await call('start', key));
    } else {
      let end = null;
      if (now() - start > (a.limit || 3) * 3600000) {
        end = await askEnd(a, start);
        if (end === undefined) return;
        if (end === 'drop') { apply(await call('cancel', key)); return; }
      }
      delete S.running[key]; render();
      apply(await call('stop', key, end));
    }
  } catch (e) { fail(e); refresh(); }
  finally { busy[key] = false; render(); }
}
async function del(id, d) {
  if (!confirm('Delete this entry? Notion will be updated.')) return;
  try { apply(await call('del', d, id)); } catch (e) { fail(e); }
}
// ---- Evening check-in: every tap saves straight to today's Notion row (Diet, Suplementy, Nicotine, Review, Wordle).
const REVIEW = [['Katastrofa', '#ff5d73'], ['Nic moc', '#ff8a3d'], ['Mid', '#ffd05c'], ['Spokojenej', '#4f8cff'], ['Peak', '#a66bff']];
const WORDLE = ['1', '2', '3', '4', '5', '6', 'Failed'];
const SW = [
  ['diet', 'Diet', 'Stuck to the plan', '#5cc96b', '<path d="M5 19c0-8 5-13 14-14 0 9-5 14-14 14zM5 19l7-7"/>'],
  ['supp', 'Supplements', 'Took them today', '#a66bff', '<path d="M10.5 20.5a4.95 4.95 0 01-7-7l10-10a4.95 4.95 0 017 7l-10 10zM8.5 8.5l7 7"/>'],
  ['quit', 'Quit', 'Stayed clean today', '#ff5d73', '🚭'],
  ['zmrd', 'Zmrd Najman', 'Tick if yes', '#ffd05c', '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>'],
];
let VIEW = lsGet('view') === 'c' ? 'c' : 't';
let CI = null, ciPending = 0, ciMsg = '';
const ciBlank = () => ({ date: ymd(now()), diet: false, supp: false, quit: false, review: null, wordle: null });
function ciCache() {
  if (CI) return CI;
  try { const c = JSON.parse(lsGet('ci:' + WHO) || 'null'); if (c && c.date === ymd(now())) return (CI = c); } catch (e) {}
  return null;
}
function renderCi() {
  const el = $('vc'); if (!el) return;
  const c = ciCache() || ciBlank();
  const rows = SW.map(r => '<div class="cr"><div class="cic">' + (r[4][0] === '<' ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="' + r[3] +
    '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + r[4] + '</svg>' : '<span style="font-size:20px;line-height:1">' + r[4] + '</span>') + '</div>' +
    '<div class="cn"><b>' + r[1] + '</b><span>' + (r[0] === 'quit' && c.streak ? '🔥 ' + c.streak + (c.streak === 1 ? ' day' : ' days') + ' clean' : r[2]) + '</span></div>' +
    '<button class="sw' + (c[r[0]] ? ' on' : '') + '" data-ci="' + r[0] + '" aria-pressed="' + !!c[r[0]] + '" aria-label="' + r[1] + '"></button></div>').join('');
  const rev = REVIEW.map(r => '<button class="' + (c.review === r[0] ? 'on' : '') + '" style="--c:' + r[1] + '" data-ci="review" data-val="' + r[0] +
    '" aria-pressed="' + (c.review === r[0]) + '" aria-label="' + r[0] + '"></button>').join('');
  const wd = WORDLE.map(w => '<button class="' + (c.wordle === w ? 'on' : '') + '" data-ci="wordle" data-val="' + w + '" aria-pressed="' + (c.wordle === w) +
    '"' + (w === 'Failed' ? ' aria-label="Failed"' : '') + '>' + (w === 'Failed' ? 'X' : w) + '</button>').join('');
  el.innerHTML = '<div class="ci">' + rows + '</div>' +
    '<div class="lab">How was your day?</div><div class="rev">' + rev + '</div>' +
    '<div class="revname' + (c.review ? '' : ' none') + '">' + (c.review || 'Tap how it went') + '</div>' +
    '<div class="lab">Wordle</div><div class="wd">' + wd + '</div>' +
    '<div class="cimsg">' + ciMsg + '</div>';
}
async function ciTap(field, val) {
  const c = ciCache() || (CI = ciBlank());
  if (c.date !== ymd(now())) { CI = ciBlank(); }
  const cur = CI[field];
  CI[field] = (field === 'review' || field === 'wordle') ? (cur === val ? null : val) : !cur;
  const nv = CI[field];
  if (field === 'quit' && CI.streak != null) CI.streak = Math.max(0, CI.streak + (nv ? 1 : -1));
  ciMsg = 'Saving…'; lsSet('ci:' + WHO, JSON.stringify(CI)); renderCi();
  ciPending++;
  try { const r = await call('ciSet', field, nv); if (r && r.ci && r.ci.streak != null) CI.streak = r.ci.streak; lsSet('ci:' + WHO, JSON.stringify(CI)); ciPending--; if (!ciPending) { ciMsg = 'Saved to Notion'; if (VIEW === 'c') renderCi(); } }
  catch (e) { ciPending--; ciMsg = ''; fail(e); refreshCi(true); }
}
async function refreshCi(force) {
  if (!API || !WHO || (ciPending && !force)) return;
  try {
    const r = await call('ciGet');
    if (ciPending && !force) return;
    CI = r.ci; lsSet('ci:' + WHO, JSON.stringify(CI));
    if (VIEW === 'c') renderCi();
  } catch (e) {}
}
function setView(v) { VIEW = v; lsSet('view', v); render(); if (v === 'c') refreshCi(); window.scrollTo(0, 0); }
async function refresh() {
  if (!API || !WHO) return;
  try { apply(await call('state')); } catch (e) { if (!loaded) toast('Can’t connect — check your internet.'); }
  if (VIEW === 'c') refreshCi();
}

document.addEventListener('click', e => {
  const w = e.target.closest('[data-who]');
  if (w) { WHO = w.dataset.who; lsSet('who', WHO); S = JSON.parse(lsGet('state:' + WHO) || 'null') || { now: Date.now(), running: {}, sessions: [], sync: null }; loaded = false; CI = null; ciMsg = ''; $('app').innerHTML = ''; render(); return refresh(); }
  if (e.target.id === 'switch') { if (confirm('Switch to the other person?')) { WHO = null; lsSet('who', ''); $('app').innerHTML = ''; render(); } return; }
  const v = e.target.closest('[data-v]'); if (v) return setView(v.dataset.v);
  const ci = e.target.closest('[data-ci]'); if (ci) return ciTap(ci.dataset.ci, ci.dataset.val);
  const t = e.target.closest('[data-k]'); if (t) return tap(t.dataset.k);
  const d = e.target.closest('[data-del]'); if (d) return del(d.dataset.del, d.dataset.d);
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
setInterval(tick, 1000); setInterval(refresh, 60000);
// Updates: check for a new version on every open and reload straight into it (no second launch needed).
if ('serviceWorker' in navigator) {
  const hadSW = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadSW && !reloaded) { reloaded = true; location.reload(); } });
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.update().catch(() => {});
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
  }).catch(() => {});
}
render(); refresh();
</script>
</body>
</html>
